<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ანITა Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+GO:wght@300;400;500;700&display=swap');
        body { font-family: 'Fira GO', sans-serif; }
        .chat-bubble { max-width: 85%; border-radius: 1.2rem; padding: 0.8rem 1rem; line-height: 1.5; font-size: 0.9rem; position: relative; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .user-bubble { background: #0084ff; color: white; align-self: flex-end; border-bottom-right-radius: 0.2rem; box-shadow: 0 2px 5px rgba(0,132,255,0.2); }
        .ai-bubble { background: #f0f2f5; color: #1c1e21; align-self: flex-start; border-bottom-left-radius: 0.2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .is-waiting { opacity: 0.6; pointer-events: none; filter: grayscale(0.5); }
        .typing-container { display: flex; gap: 4px; padding: 12px 16px; }
        .dot { width: 6px; height: 6px; background: #90949c; border-radius: 50%; animation: typing 1s infinite ease-in-out; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #bcc0c4; border-radius: 10px; }
        audio::-webkit-media-controls-panel { background-color: #f1f3f4; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center p-0 sm:p-4">
    <div class="w-full max-w-lg bg-white shadow-2xl h-full sm:h-[90vh] sm:rounded-2xl flex flex-col overflow-hidden border border-gray-200">
        <div class="p-4 border-b flex justify-between items-center bg-white">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-blue-400 rounded-full flex items-center justify-center text-white font-bold shadow-md">ან</div>
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>
                </div>
                <div>
                    <h2 class="font-bold text-gray-800 text-sm">ანITა</h2>
                    <p id="limitTxt" class="text-[9px] text-gray-500 font-bold uppercase tracking-tighter">მედია ლიმიტი: 3/3</p>
                </div>
            </div>
            <select id="modelSelect" class="text-[10px] bg-gray-100 font-bold p-2 rounded-lg border-none focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer text-gray-600">
                <option value="gemini">GEMINI 3 FLASH</option>
                <option value="gpt">GPT-4o VISION</option>
            </select>
        </div>

        <div id="chatBox" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 bg-white">
            <div class="ai-bubble chat-bubble">გამარჯობა! მე ვარ ანITა, შენი ციფრული მეგობარი. 🤖 რით შემიძლია დაგეხმარო?</div>
        </div>

        <div id="inputSection" class="p-4 bg-white border-t">
            <div class="flex items-center gap-2 bg-gray-100 rounded-2xl px-3 py-1.5 focus-within:bg-gray-200 transition-all duration-200">
                <label class="p-2 text-blue-500 cursor-pointer hover:bg-white rounded-full transition shadow-sm active:scale-90">
                    <i class="fas fa-image"></i>
                    <input type="file" id="imgInp" hidden accept="image/*">
                </label>
                <button id="recordBtn" class="p-2 text-blue-500 hover:bg-white rounded-full transition shadow-sm active:scale-90">
                    <i class="fas fa-microphone"></i>
                </button>
                <input type="text" id="promptInp" class="flex-1 bg-transparent border-none focus:ring-0 text-sm py-2 placeholder-gray-400" placeholder="დაწერე შეტყობინება..." onkeypress="if(event.key==='Enter') send()">
                <button id="sendBtn" onclick="send()" class="p-2 bg-blue-500 text-white rounded-full w-10 h-10 flex items-center justify-center hover:bg-blue-600 shadow-md transition-all active:scale-90">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder, audioChunks = [], audioBlob = null, isRecording = false, isWaiting = false;
        const chatBox = document.getElementById('chatBox');

        // Microphone Logic
        document.getElementById('recordBtn').onclick = async () => {
            if (isWaiting) return;
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    document.getElementById('recordBtn').innerHTML = '<i class="fas fa-stop text-red-500 animate-pulse"></i>';
                } catch (err) { alert("მიკროფონთან წვდომა უარყოფილია"); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('recordBtn').innerHTML = '<i class="fas fa-microphone"></i>';
            }
        };

        // Main Send Function
        async function send() {
            const promptInp = document.getElementById('promptInp');
            const prompt = promptInp.value.trim();
            const imgInput = document.getElementById('imgInp');
            const imgFile = imgInput.files[0];
            
            if (isWaiting || (!prompt && !imgFile && !audioBlob)) return;

            isWaiting = true;
            document.getElementById('inputSection').classList.add('is-waiting');

            // Add User Message to UI
            let userHtml = `<div class="user-bubble chat-bubble flex flex-col gap-2">`;
            if (prompt) userHtml += `<span>${prompt}</span>`;
            if (imgFile) userHtml += `<img src="${URL.createObjectURL(imgFile)}" class="rounded-lg max-h-48 shadow-sm">`;
            if (audioBlob) userHtml += `<audio controls src="${URL.createObjectURL(audioBlob)}" class="w-48 h-8"></audio>`;
            userHtml += `</div>`;
            chatBox.innerHTML += userHtml;

            // Add Typing Indicator
            const typingId = "typing-" + Date.now();
            chatBox.innerHTML += `<div id="${typingId}" class="ai-bubble chat-bubble typing-container shadow-sm"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            // Prepare Data
            const fd = new FormData();
            fd.append("user_id", "session_user_1");
            fd.append("prompt", prompt || "აღწერე ფაილი");
            fd.append("model_choice", document.getElementById('modelSelect').value);
            if (imgFile) fd.append("image", imgFile);
            if (audioBlob) fd.append("audio", audioBlob, "voice_msg.webm");

            // Smart URL selection
            const API_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
                ? 'http://127.0.0.1:8090/chat'
                : '/chat';

            try {
                const res = await fetch(API_URL, { method: 'POST', body: fd });
                const data = await res.json();
                
                const tElem = document.getElementById(typingId);
                if(tElem) tElem.remove();

                if (res.ok) {
                    chatBox.innerHTML += `<div class="ai-bubble chat-bubble shadow-sm">${data.response}</div>`;
                    document.getElementById('limitTxt').innerText = `მედია ლიმიტი: ${data.media_remaining}/3`;
                } else { 
                    chatBox.innerHTML += `<div class="ai-bubble chat-bubble text-red-500">შეცდომა: ${data.detail}</div>`; 
                }
            } catch (e) {
                const tElem = document.getElementById(typingId);
                if(tElem) tElem.remove();
                chatBox.innerHTML += `<div class="ai-bubble chat-bubble text-red-400 italic text-xs">კავშირი ვერ დამყარდა. დარწმუნდი, რომ ბექენდი ჩართულია.</div>`;
            }

            // Cleanup
            isWaiting = false;
            document.getElementById('inputSection').classList.remove('is-waiting');
            promptInp.value = "";
            imgInput.value = "";
            audioBlob = null;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
